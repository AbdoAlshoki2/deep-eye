[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-eye"
version = "0.1.0"
description = "Local, file-based tracing for LLM agents with a terminal viewer. Works with any framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
examples = ["langchain>=1", "langgraph", "langchain-google-genai", "python-dotenv"]
dev = ["pytest>=8"]

[project.scripts]
deep-eye = "deep_eye.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_eye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
