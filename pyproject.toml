[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-eye"
dynamic = ["version"]
description = "Local, file-based tracing for LLM agents with a terminal viewer. Works with any framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["textual>=0.80", "rich>=13"]

[project.optional-dependencies]
# one extra per framework adapter (deep_eye/integrations/<name>.py); see "Supported frameworks"
langchain = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.21"]
otel = ["opentelemetry-sdk>=1.20"]
examples = ["langchain>=1", "langgraph", "langchain-google-genai", "python-dotenv"]
dev = ["pytest>=8"]

[project.scripts]
deep-eye = "deep_eye.cli:main"

[tool.hatch.version]
path = "src/deep_eye/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_eye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
